{# Macros: iconos y nivel de riesgo. #}
{% macro icono(nombre, clase="") -%}
<svg class="ico {{ clase }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if nombre == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif nombre == "ok" %}<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
{%- elif nombre == "alerta" %}<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/>
{%- elif nombre == "peligro" %}<path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"/><path d="M12 7.5v5.5M12 16.5v.01"/>
{%- elif nombre == "ojo" %}<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif nombre == "ojo-tachado" %}<path d="M10.7 5.7A10 10 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4M6.6 7.4A17 17 0 0 0 2 12s3.6 6.5 10 6.5c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/>
{%- elif nombre == "flecha" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif nombre == "atras" %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif nombre == "escudo" %}<path d="M12 3l8 3v6c0 5-3.4 8.3-8 9.5C7.4 20.3 4 17 4 12V6z"/>
{%- elif nombre == "llave" %}<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>
{%- elif nombre == "disco" %}<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
{%- elif nombre == "correo" %}<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>
{%- elif nombre == "red" %}<circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4.3M12 11.5l-6 5.5M12 11.5l6 5.5"/>
{%- elif nombre == "lista" %}<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>
{%- elif nombre == "motor" %}<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>
{%- elif nombre == "barras" %}<path d="M5 20V10M12 20V4M19 20v-7"/>
{%- elif nombre == "libro" %}<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/>
{%- elif nombre == "ajustes" %}<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.2 5.2L7 7M17 17l1.8 1.8M5.2 18.8L7 17M17 7l1.8-1.8"/>
{%- elif nombre == "medidor" %}<path d="M5 18a8 8 0 1114 0"/><path d="M12 18l4-6"/><path d="M12 6.5V8M6.5 9l1.1 1.1M17.5 9l-1.1 1.1"/>
{%- elif nombre == "reglas" %}<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9.5 14l2 2 3.5-4"/>
{%- elif nombre == "pausa" %}<path d="M9 6v12M15 6v12"/>
{%- elif nombre == "reproducir" %}<path d="M8 5.5v13l10-6.5z"/>
{%- elif nombre == "mas" %}<path d="M12 5v14M5 12h14"/>
{%- elif nombre == "doc" %}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>
{%- elif nombre == "ayuda" %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 115 1c-.9.9-2.5 1.3-2.5 3M12 17v.01"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro nivel(clave, nombres) -%}
{%- set ic = {"bajo": "ok", "medio": "alerta", "alto": "peligro"}[clave] -%}
<span class="nivel nivel-{{ clave }}">{{ icono(ic) }}{{ nombres[clave] }}</span>
{%- endmacro %}
